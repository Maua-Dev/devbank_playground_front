name: AWS CD

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - homolog
      - prod

jobs:
  DeployToAWS:
    environment: 
      name: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v2

      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: sa-east-1
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GithubActionsRole
          role-session-name: github-action

      - name: Use Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Setting stage and stack name
        run: |
          echo "STAGE=${{ github.ref_name }}" 
          PROJECT_NAME=$(echo ${{ github.event.repository.name }} | sed -e 's/[-_]/ /g' | awk '{for(i=1;i<=NF;i++)sub(/./,toupper(substr($i,1,1)),$i)}1' | sed -e 's/ //g')
          echo "PROJECT_NAME=${PROJECT_NAME}"
          echo "STACK_NAME=${PROJECT_NAME}StackFront${{github.ref_name}}"

          echo "STACK_NAME=${PROJECT_NAME}StackFront${{github.ref_name}}" >> $GITHUB_ENV
          echo "PROJECT_NAME=${PROJECT_NAME}Front" >> $GITHUB_ENV

      - name: Installing Dependencies
        run: |
          npm install -g aws-cdk
          npm install
          cd iac
          npm install

      - name: Cleanup orphaned CDK bootstrap resources
        run: |
          echo "🔄 Limpando recursos órfãos do CDKToolkit..."
          aws ecr delete-repository \
            --repository-name cdk-hnb659fds-container-assets-${{ secrets.AWS_ACCOUNT_ID }}-sa-east-1 \
            --force || true

          aws ssm delete-parameter \
            --name "/cdk-bootstrap/hnb659fds/version" \
            --region sa-east-1 || true

          aws iam detach-role-policy \
            --role-name cdk-hnb659fds-lookup-role-${{ secrets.AWS_ACCOUNT_ID }}-sa-east-1 \
            --policy-arn arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:policy/LookupRolePolicy \
            || true

          aws iam delete-role \
            --role-name cdk-hnb659fds-lookup-role-${{ secrets.AWS_ACCOUNT_ID }}-sa-east-1 \
            || true

          aws iam delete-role \
            --role-name cdk-hnb659fds-cfn-exec-role
